<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Test Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 30px;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .log-container {
            background: #f8f8f8;
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 20px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Customate Widget Debug Page</h1>
    <p>This page will help debug the Customate chat widget. You should see the chat button in the bottom right.</p>
    
    <div class="test-box">
        <h2>Configuration</h2>
        <ul>
            <li>API Key: <span id="apiKeyDisplay">eEx17lbp60FYeWlZxcrg6TYbsK-ZiA_unlkc8cUQTqA</span></li>
            <li>Backend URL: <span id="backendUrlDisplay">http://localhost:8000</span></li>
        </ul>
        <button id="reloadWidget">Reload Widget</button>
    </div>
    
    <div class="log-container" id="logContainer">
        <div class="info">Widget debug logs will appear here...</div>
    </div>
    
    <script>
        // Custom logger that displays in the page
        function log(message, type = 'info') {
            console.log(message);
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = type;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        // Override console.log to also show in our container
        const originalLog = console.log;
        const originalError = console.error;
        console.log = function() {
            originalLog.apply(console, arguments);
            log(Array.from(arguments).join(' '));
        };
        console.error = function() {
            originalError.apply(console, arguments);
            log(Array.from(arguments).join(' '), 'error');
        };
        
        // Widget configuration
        const config = {
            apiKey: 'eEx17lbp60FYeWlZxcrg6TYbsK-ZiA_unlkc8cUQTqA',
            primaryColor: '#4f46e5',
            position: 'bottom-right',
            chatbotName: 'Debug Assistant',
            showTypingIndicator: true,
            enableSuggestions: true,
            resetOnPageRefresh: true,
            sessionTimeout: 30,
            apiUrl: 'http://localhost:8000',
            customData: {
                llmProvider: 'deepseek',
                llmModel: 'deepseek-chat'
            }
        };
        
        // Update the displayed config
        document.getElementById('apiKeyDisplay').textContent = config.apiKey;
        document.getElementById('backendUrlDisplay').textContent = config.apiUrl;
        
        // Function to load widget script
        function loadWidgetScript() {
            // Remove any existing script
            const existingScript = document.getElementById('customate-widget-script');
            if (existingScript) {
                existingScript.remove();
                log('Removed existing widget script', 'info');
            }
            
            // Remove any existing widget elements
            const existingWidget = document.getElementById('customate-chat-widget');
            if (existingWidget) {
                existingWidget.remove();
                log('Removed existing widget elements', 'info');
            }
            
            // Create the global config
            window.customateConfig = config;
            log('Set window.customateConfig', 'success');
            
            // Create new script element
            const script = document.createElement('script');
            script.id = 'customate-widget-script';
            script.src = `${config.apiUrl}/api/widget/widget.js`;
            script.async = true;
            script.onerror = function() {
                log(`Failed to load widget script from ${script.src}`, 'error');
            };
            script.onload = function() {
                log('Widget script loaded successfully', 'success');
            };
            
            // Add to document
            document.body.appendChild(script);
            log(`Loading widget script from ${script.src}`, 'info');
        }
        
        // Load script on page load
        window.addEventListener('DOMContentLoaded', function() {
            log('Page loaded, initializing widget...', 'info');
            loadWidgetScript();
        });
        
        // Add reload button handler
        document.getElementById('reloadWidget').addEventListener('click', function() {
            log('Manually reloading widget...', 'info');
            loadWidgetScript();
        });
        
        // Add inline widget code for redundancy
        setTimeout(() => {
            // If widget button hasn't appeared after 3 seconds, inject inline widget code
            if (!document.getElementById('customate-chat-widget')) {
                log('Widget not loaded after timeout, trying inline code...', 'info');
                
                // Inline widget code
                (function() {
                    log('Running inline widget loader', 'info');
                    // Configuration object to store settings
                    const config = window.customateConfig || {};
                    
                    // Default settings
                    const defaults = {
                        apiKey: null,
                        position: 'bottom-right',
                        primaryColor: '#4f46e5',
                        apiUrl: 'http://localhost:8000',
                        chatbotName: 'AI Assistant',
                        showTypingIndicator: true,
                        enableSuggestions: true
                    };
                    
                    // Merge configs
                    const settings = {...defaults, ...config};
                    log('Merged settings:', 'info');
                    
                    // Make sure we have an API key
                    if (!settings.apiKey) {
                        log('API key is required', 'error');
                        return;
                    }
                    
                    // Create widget container
                    const container = document.createElement('div');
                    container.id = 'customate-chat-widget';
                    container.style.position = 'fixed';
                    container.style.zIndex = '9999';
                    container.style.overflow = 'hidden';
                    container.style.bottom = '20px';
                    container.style.right = '20px';
                    
                    document.body.appendChild(container);
                    log('Added widget container to DOM', 'success');
                    
                    // Create toggle button
                    const button = document.createElement('button');
                    button.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z" fill="currentColor"/></svg>';
                    button.style.width = '60px';
                    button.style.height = '60px';
                    button.style.borderRadius = '50%';
                    button.style.backgroundColor = settings.primaryColor;
                    button.style.color = 'white';
                    button.style.border = 'none';
                    button.style.cursor = 'pointer';
                    button.style.display = 'flex';
                    button.style.alignItems = 'center';
                    button.style.justifyContent = 'center';
                    button.style.boxShadow = '0 2px 10px rgba(0, 0, 0, 0.2)';
                    button.style.padding = '0';
                    
                    container.appendChild(button);
                    log('Added button to container', 'success');
                    
                    // Widget state
                    let isOpen = false;
                    let chatFrame = null;
                    
                    // Toggle widget
                    button.addEventListener('click', function(e) {
                        log('Widget button clicked', 'info');
                        e.preventDefault();
                        
                        if (isOpen) {
                            // Close widget
                            if (chatFrame) {
                                chatFrame.style.display = 'none';
                            }
                            isOpen = false;
                            log('Widget closed', 'info');
                        } else {
                            // Open widget or create it if it doesn't exist
                            if (!chatFrame) {
                                log('Creating chat iframe', 'info');
                                // Create iframe for the chat interface
                                chatFrame = document.createElement('iframe');
                                chatFrame.style.width = '350px';
                                chatFrame.style.height = '500px';
                                chatFrame.style.border = 'none';
                                chatFrame.style.borderRadius = '10px';
                                chatFrame.style.boxShadow = '0 2px 10px rgba(0, 0, 0, 0.2)';
                                chatFrame.style.backgroundColor = 'white';
                                chatFrame.style.position = 'absolute';
                                chatFrame.style.bottom = '80px';
                                chatFrame.style.right = '0';
                                
                                // Set the src to your chat interface URL with API key
                                const chatUrl = `${settings.apiUrl}/api/widget/chat?apiKey=${encodeURIComponent(settings.apiKey)}&config=${encodeURIComponent(JSON.stringify(settings))}`;
                                
                                log('Loading chat iframe from: ' + chatUrl, 'info');
                                chatFrame.src = chatUrl;
                                
                                container.appendChild(chatFrame);
                                
                                // Listen for close messages from the iframe
                                window.addEventListener('message', function(event) {
                                    if (event.data === 'closeChat') {
                                        chatFrame.style.display = 'none';
                                        isOpen = false;
                                        log('Received close message from iframe', 'info');
                                    }
                                });
                            } else {
                                log('Showing existing chat iframe', 'info');
                                chatFrame.style.display = 'block';
                            }
                            isOpen = true;
                        }
                    });
                    
                    log('Widget initialized successfully', 'success');
                })();
            }
        }, 3000);
    </script>
</body>
</html>
