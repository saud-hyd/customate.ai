<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chat Widget Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 20px;
        line-height: 1.6;
        max-width: 800px;
        margin: 0 auto;
      }
      h1 {
        color: #333;
      }
      .test-box {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 8px;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <h1>Testing Customate Chat Widget</h1>
    <p>You should see a chat button in the bottom right corner. <strong>Click on it</strong> to open the chat widget.</p>
    
    <div class="test-box">
      <h2>Troubleshooting</h2>
      <ul>
        <li>Make sure your backend server is running on <code>http://localhost:8000</code></li>
        <li>Check browser console for any error messages</li>
        <li>Verify that the API key is valid</li>
      </ul>
    </div>
    
    <!-- Customate.ai Chat Widget -->
    <script>
      window.customateConfig = {
        apiKey: 'eEx17lbp60FYeWlZxcrg6TYbsK-ZiA_unlkc8cUQTqA', // Replace with your actual API key
        primaryColor: '#4f46e5',
        position: 'bottom-right',
        chatbotName: 'AI Assistant',
        showTypingIndicator: true,
        enableSuggestions: true,
        resetOnPageRefresh: true,
        sessionTimeout: 30,
        apiUrl: 'http://localhost:8000', // Make sure this matches your backend URL
        customData: {
          llmProvider: 'deepseek',
          llmModel: 'deepseek-chat'
        }
      };
    </script>
    <script src="http://localhost:8000/api/widget/widget.js" async></script>
  </body>
</html>
