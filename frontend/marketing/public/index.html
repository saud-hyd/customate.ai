<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Customate.ai - Build custom AI chatbots for your business" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Customate.ai - Custom AI Chatbots</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- Chat widget implementation -->
    <script>
      // Wait for page to fully load including React
      window.addEventListener('load', function() {
        // Add delay to ensure React is fully rendered
        setTimeout(function() {
          // Create widget container
          const container = document.createElement('div');
          container.id = 'chat-widget-container';
          container.style.position = 'fixed';
          container.style.bottom = '20px';
          container.style.right = '20px';
          container.style.zIndex = '9999';
          document.body.appendChild(container);
          
          // Create chat button
          const button = document.createElement('button');
          button.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z" fill="currentColor"/></svg>';
          button.style.width = '60px';
          button.style.height = '60px';
          button.style.borderRadius = '50%';
          button.style.backgroundColor = '#4f46e5';
          button.style.color = 'white';
          button.style.border = 'none';
          button.style.cursor = 'pointer';
          button.style.display = 'flex';
          button.style.alignItems = 'center';
          button.style.justifyContent = 'center';
          button.style.boxShadow = '0 2px 10px rgba(0, 0, 0, 0.2)';
          button.style.transition = 'transform 0.2s';
          container.appendChild(button);
          
          // Add hover effects
          button.addEventListener('mouseover', function() {
            button.style.transform = 'scale(1.05)';
          });
          
          button.addEventListener('mouseout', function() {
            button.style.transform = 'scale(1)';
          });
          
          // Variables to track state
          let isOpen = false;
          let chatFrame = null;
          
          // Toggle chat when button is clicked
          button.addEventListener('click', function() {
            console.log('Chat button clicked');
            
            if (!chatFrame) {
              // First click - create the iframe
              chatFrame = document.createElement('iframe');
              chatFrame.style.width = '350px';
              chatFrame.style.height = '500px';
              chatFrame.style.border = 'none';
              chatFrame.style.position = 'absolute';
              chatFrame.style.bottom = '80px';
              chatFrame.style.right = '0';
              chatFrame.style.backgroundColor = 'white';
              chatFrame.style.borderRadius = '10px';
              chatFrame.style.boxShadow = '0 2px 10px rgba(0, 0, 0, 0.2)';
              chatFrame.style.transition = 'opacity 0.3s';
              chatFrame.style.zIndex = '10000'; // Ensure high z-index
              
              const apiKey = 'eEx17lbp60FYeWlZxcrg6TYbsK-ZiA_unlkc8cUQTqA';
              
              // IMPORTANT: Use a minimal config URL to avoid the referrer length issue
              chatFrame.src = `https://customate-ai-1.onrender.com/api/widget/chat?apiKey=${apiKey}&color=%234f46e5`;
              chatFrame.title = "Chat with Customate AI";
              
              container.appendChild(chatFrame);
              isOpen = true;
            } else {
              // Subsequent clicks - toggle visibility
              if (isOpen) {
                chatFrame.style.display = 'none';
                isOpen = false;
              } else {
                chatFrame.style.display = 'block';
                isOpen = true;
              }
            }
          });

          // Listen for close messages from the iframe
          window.addEventListener('message', function(event) {
            if (event.data === 'closeChat' && chatFrame) {
              chatFrame.style.display = 'none';
              isOpen = false;
            }
          });
          
          console.log('Chat widget initialized');
        }, 1500); // 1.5 second delay
      });
    </script>
  </body>
</html>
