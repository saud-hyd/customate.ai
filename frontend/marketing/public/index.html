<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Customate.ai - Build custom AI chatbots for your business" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Customate.ai - Custom AI Chatbots</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- Customate.ai Chatbot Widget with Environment Detection -->
    <script>
      // Automatically detect environment based on hostname
      const isLocalhost = window.location.hostname === 'localhost' || 
                         window.location.hostname === '127.0.0.1';
      const backendUrl = isLocalhost ? 'http://localhost:8000' : 'https://customate-ai-1.onrender.com';
      
      // Configure the widget
      window.customateConfig = {
        apiKey: 'eEx17lbp60FYeWlZxcrg6TYbsK-ZiA_unlkc8cUQTqA',
        apiUrl: backendUrl,  // Set URL based on environment detection
        primaryColor: '#4f46e5',
        debug: isLocalhost  // Only enable debug in localhost environment
      };
      
      // Log environment info in development
      if (isLocalhost) {
        console.log('Running in development environment');
        console.log('Using backend URL:', backendUrl);
      }
    </script>
    
    <!-- Dynamically insert script tag with correct URL -->
    <script>
      const scriptSrc = `${window.customateConfig.apiUrl}/api/widget/widget.js`;
      const scriptTag = document.createElement('script');
      scriptTag.src = scriptSrc;
      scriptTag.async = true;
      document.body.appendChild(scriptTag);
    </script>
  </body>
</html>
