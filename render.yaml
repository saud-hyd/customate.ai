services:
  - type: web
    name: customate-api
    env: python
    buildCommand: |
      # Install Python dependencies
      pip install -r requirements.txt
      
      # Verify widget files exist (optional check)
      if [ -f "frontend/widget-app/dist/index.html" ]; then
        echo "✅ Widget files found and ready to serve"
        ls -la frontend/widget-app/dist/
      else
        echo "⚠️ Warning: Widget files not found"
        echo "Expected: frontend/widget-app/dist/index.html"
        echo "Make sure widget is built and committed"
      fi
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: customate-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
    plan: starter

databases:
  - name: customate-db
    databaseName: customate
    user: customate_user
    plan: starter